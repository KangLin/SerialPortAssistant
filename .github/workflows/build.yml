# Author：Kang Lin <kl222@126.com>

name: build

env:
  artifact_path: artifact_path
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SerialPortAssistant_VERSION: 0.5.34-dev

on:
  push:
  pull_request:
  
jobs:
  ubuntu:
    uses: ./.github/workflows/ubuntu.yml

  docker:
    uses: ./.github/workflows/docker.yml
    secrets: inherit

  appimage:
    if: false
    uses: ./.github/workflows/appimage.yml

  flatpak:
    uses: ./.github/workflows/flatpak.yml
    secrets: inherit

  snap:
    if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
    uses: ./.github/workflows/snap.yml
    secrets: inherit

  msvc:
    uses: ./.github/workflows/msvc.yml

  mingw:
    uses: ./.github/workflows/mingw.yml

  macos:
    uses: ./.github/workflows/macos.yml

  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  deploy:
    #if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    needs: [ubuntu, docker, msvc, android, macos, snap, flatpak]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          submodules: true

      - name: clean test tag
        if: ${{ startsWith(github.ref, 'refs/heads/master') }}
        continue-on-error: true
        run: |
          gh release delete test_${{ github.ref_name }} -y --cleanup-tag
      
      - name: Download ubuntu
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.ubuntu.outputs.name }}*
          path: ${{ env.artifact_path }}
          merge-multiple: true

      - name: Download docker
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.docker.outputs.name }}*
          path: ${{ env.artifact_path }}
          merge-multiple: true

      - name: Download appimage
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.appimage.outputs.name }}*
          path: ${{ env.artifact_path }}
          merge-multiple: true

      - name: Download flatpak
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.flatpak.outputs.name }}*
          path: ${{ env.artifact_path }}
          merge-multiple: true

      - name: Download snap
        uses: actions/download-artifact@v7
        with:
          pattern: ${{ needs.snap.outputs.name }}*
          path: ${{ env.artifact_path }}
          merge-multiple: true

      - name: Download msvc
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.msvc.outputs.name }}_*
          path: ${{ env.artifact_path }}
          merge-multiple: true

      - name: Download android
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.android.outputs.name }}_*
          path: ${{ env.artifact_path }}
          merge-multiple: true

      - name: Download macos
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.macos.outputs.name }}_*
          path: ${{ env.artifact_path }}
          merge-multiple: true

      - name: Process configure file
        run: |
          git clone https://github.com/KangLin/RabbitCommon.git
          ./RabbitCommon/Install/MergeJsonFile.sh \
              "${{ github.workspace }}/update.json" \
              "${{ env.artifact_path }}" "${{ env.artifact_path }}/version.json"
          rm ${{ env.artifact_path }}/*.json
      
      - name: Add test comment in Release.md file
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "**This release is for development and testing purposes only!**" >> ${{github.workspace}}/Release.md
          echo "Commit: [${{github.sha}}](https://github.com/KangLin/SerialPortAssistant/commit/${{github.sha}})" >> ${{github.workspace}}/Release.md
          echo "" >> ${{github.workspace}}/Release.md
          echo "[:us: Change log](ChangeLog.md)" >> ${{github.workspace}}/Release.md
          echo "" >> ${{github.workspace}}/Release.md

      - name: Make relase file
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          echo "[:cn: 修改日志](https://github.com/KangLin/SerialPortAssistant/blob/v${{env.SerialPortAssistant_VERSION}}/ChangeLog_zh_CN.md)" > ${{github.workspace}}/Release.md
          echo "[:us: Change log](https://github.com/KangLin/SerialPortAssistant/blob/v${{env.SerialPortAssistant_VERSION}}/ChangeLog.md)" >> ${{github.workspace}}/Release.md
          echo "" >> ${{github.workspace}}/Release.md

      - name: md5
        run: |
          echo "" >> ${{github.workspace}}/Release.md
          echo "## File checksum:" >> ${{github.workspace}}/CheckSum.md
          echo "" >> ${{github.workspace}}/CheckSum.md
          echo "|File|Checksum(md5)|Checksum(sha256)|" >> ${{github.workspace}}/CheckSum.md
          echo "| :- |    :-       |:-|" >> ${{github.workspace}}/CheckSum.md
          cd ${{ env.artifact_path }}
          for file in *
          do
              echo "$file"
              if [ -f $file ]; then
                  if [ "${file##*.}" != "xml" ] && [ "${file##*.}" != "json" ]; then
                      SumMd5=`md5sum $file | awk '{print  "|", $2, "|", $1, "|"}'`
                      Sum256=`sha256sum $file | awk '{print $1, "|"}'`
                      echo "${SumMd5}${Sum256}" >> ${{github.workspace}}/CheckSum.md
                  fi
              else
                 rm -fr $file
              fi
          done

      - name: Add download
        run: |
          export BRANCH_NAME=${{ github.ref_name }}
          if [ "${{ github.ref_name }}" == "master" ]; then
              export BRANCH_NAME=test_${{ github.ref_name }}
          fi
          echo "## Download:" >> ${{github.workspace}}/Release.md
          echo "" >> ${{github.workspace}}/Release.md
          echo "|       | x86-64 (64-bit) | x86-32 (32-bit) | AArch64 (ARM64) | ARMv7 (32-bit) |Remark|备注|" >> ${{github.workspace}}/Release.md
          echo "|:-     | :-------------- | :-------------- | :-------------- | :------------- |:-----|:--|" >> ${{github.workspace}}/Release.md
          echo "|Windows 7 SP1 or later|[EXE](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_v${{env.SerialPortAssistant_VERSION}}_win64_msvc2022_64_qt6.10.3_Setup.exe)|[EXE](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_v${{env.SerialPortAssistant_VERSION}}_win32_msvc2019_qt5.15.2_Setup.exe)|[EXE](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_v${{env.SerialPortAssistant_VERSION}}_win64_msvc2022_arm64_qt6.10.3_Setup.exe) | |||" >> ${{github.workspace}}/Release.md
          echo "|Windows xp SP3| |[EXE](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_v${{env.SerialPortAssistant_VERSION}}_windows_xp_x86_Setup.exe)|||||" >> ${{github.workspace}}/Release.md
          echo "|Android|[APK](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_v${{env.SerialPortAssistant_VERSION}}_android_x86_64_qt6.10.3_Release.apk) | |[APK](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_v${{env.SerialPortAssistant_VERSION}}_android_arm64_v8a_qt6.10.3_Release.apk)| |||" >> ${{github.workspace}}/Release.md
          echo "|macOS|[App zip](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_v${{env.SerialPortAssistant_VERSION}}_macos-15-intel.zip)  [dmg](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_v${{env.SerialPortAssistant_VERSION}}_macos-15-intel.dmg)||[App zip](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_v${{env.SerialPortAssistant_VERSION}}_macos-14.zip)  [dmg](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_v${{env.SerialPortAssistant_VERSION}}_macos-14.dmg)||Experiment|实验性的|" >> ${{github.workspace}}/Release.md
          echo "|Linux|[AppImage zip](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_${{env.SerialPortAssistant_VERSION}}_Linux_amd64_Setup.zip)| |[AppImage zip](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_${{env.SerialPortAssistant_VERSION}}_Linux_arm64_Setup.zip)| |Unzip the zip file, then execute \`install.sh\` to install shortcuts for application, links, and directories in graphical user interfaces (GUIs), or execute \`SerialPortAssistant_*.AppImage\` to run program in the terminal.|解压 zip 文件，然后执行 \`install.sh\`， 安装用于图形界面的目录、桌面快捷方式；或者在终端中执行 \`SerialPortAssistant_*.AppImage\` 文件，运行程序。 |" >> ${{github.workspace}}/Release.md
          echo "|Ubuntu 26.04|[DEB](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_${{env.SerialPortAssistant_VERSION}}_ubuntu_26.04_amd64.deb)| |[DEB](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_${{env.SerialPortAssistant_VERSION}}_ubuntu_26.04_arm64.deb)| |Debian 13 (trixie) and its derived Linux operating systems<br>\`sudo apt install \"deb file\"\` |Debian 13 (trixie) 以及其派生的 Linux 系统|" >> ${{github.workspace}}/Release.md
          echo "|Ubuntu 24.04|[DEB](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_${{env.SerialPortAssistant_VERSION}}_ubuntu_24.04_amd64.deb)| |[DEB](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_${{env.SerialPortAssistant_VERSION}}_ubuntu_24.04_arm64.deb)| |Debian 12 (Bookworm) and its derived Linux operating systems<br>\`sudo apt install \"deb file\"\` |Debian 12 (Bookworm) 以及其派生的 Linux 系统|" >> ${{github.workspace}}/Release.md
          RPM_VERSION=${SerialPortAssistant_VERSION//-/\_}
          echo "|Fedora 42|[RPM](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/serialportassistant-${RPM_VERSION}-1.fc42.x86_64.rpm)| |[RPM](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/serialportassistant-${RPM_VERSION}-1.fc42.aarch64.rpm)| |its derived Linux operating systems<br> \`sudo dnf install \"rpm file\"\` |以及其派生的 Linux 系统|" >> ${{github.workspace}}/Release.md

      - name: Add download for testing
        if: ${{ ! startsWith(github.ref, 'refs/tags/') }}
        run: |
          export BRANCH_NAME=${{ github.ref_name }}
          if [ "${{ github.ref_name }}" == "master" ]; then
            export BRANCH_NAME=test_${{ github.ref_name }}
          fi
          echo "|Snap|[snap](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/serial-port-assistant_${{env.SerialPortAssistant_VERSION}}_amd64.snap)| |[SNAP](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/serial-port-assistant_${{env.SerialPortAssistant_VERSION}}_arm64.snap)| |sudo snap install \"snap file\" ||" >> ${{github.workspace}}/Release.md
          echo "|Flatpak|[flatpak](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_v${{env.SerialPortAssistant_VERSION}}_Linux_x86_64.flatpak)| |[flatpak](https://github.com/KangLin/SerialPortAssistant/releases/download/${BRANCH_NAME}/SerialPortAssistant_v${{env.SerialPortAssistant_VERSION}}_Linux_aarch64.flatpak)||flatpak install \"flatpak File\" [--user] |" >> ${{github.workspace}}/Release.md

      - name: Add flathub and snap download
        run: |
          echo "" >> ${{github.workspace}}/Release.md
          echo "[![serial-port-assistant](https://snapcraft.io/serial-port-assistant/badge.svg)](https://snapcraft.io/serial-port-assistant)" >> ${{github.workspace}}/Release.md
          echo "[![Download from Flathub](https://flathub.org/api/badge?locale=en)](https://flathub.org/apps/io.github.KangLin.SerialPortAssistant)" >> ${{github.workspace}}/Release.md

      - name: Create github Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        continue-on-error: true
        run: |
          gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --notes-file ${{github.workspace}}/Release.md

      - name: Upload To Github Release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          gh release edit ${{ github.ref_name }} --notes-file ${{github.workspace}}/Release.md
          gh release upload ${{ github.ref_name }} ${{github.workspace}}/${{env.artifact_path}}/* ${{github.workspace}}/Release.md ${{github.workspace}}/CheckSum.md ${{ github.workspace }}/update.json

      - name: Upload test tag To Github Release
        if: ${{ startsWith(github.ref, 'refs/heads/master') }}
        run: |
          gh release create test_${{ github.ref_name }} --prerelease --latest=false --title "Recently developed build - ${{ github.ref_name }}" --notes-file ${{github.workspace}}/Release.md
          gh release upload test_${{ github.ref_name }} --clobber ${{github.workspace}}/${{ env.artifact_path }}/* ${{github.workspace}}/Release.md ${{github.workspace}}/CheckSum.md ${{github.workspace}}/update.json --clobber
      
